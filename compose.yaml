name: knowledge-graph-production

services:
  frontend:
    build:
      context: ./Frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./Backend/gateway
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_ADDRESS: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      WIKONTIC_URL: http://wikontic:8001
      WIKONTIC_TIMEOUT_SECONDS: ${WIKONTIC_TIMEOUT_SECONDS:-170}
      AUTH_ENABLED: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kg}:${POSTGRES_PASSWORD:-kg}@postgres:5432/${POSTGRES_DB:-knowledge_graph}
      REDIS_URL: redis://redis:6379/0
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-development-only-change-this-cookie-secret}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
      AUTH_VISITOR_TTL_SECONDS: ${AUTH_VISITOR_TTL_SECONDS:-7776000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      LOG_HASH_SALT: ${LOG_HASH_SALT:-development-log-hash-salt}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_GENERAL_REQUESTS: ${RATE_LIMIT_GENERAL_REQUESTS:-120}
      RATE_LIMIT_AUTH_REQUESTS: ${RATE_LIMIT_AUTH_REQUESTS:-10}
      RATE_LIMIT_EXTRACT_REQUESTS: ${RATE_LIMIT_EXTRACT_REQUESTS:-10}
      MAX_EXTRACTION_CHARS: ${MAX_EXTRACTION_CHARS:-100000}
      MAX_ACTIVE_JOBS_PER_WORKSPACE: ${MAX_ACTIVE_JOBS_PER_WORKSPACE:-3}
      ANONYMOUS_MODEL_ALLOWLIST: ${ANONYMOUS_MODEL_ALLOWLIST:-google/gemini-2.5-flash-lite}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-kg-documents}
      MAX_PDF_UPLOAD_BYTES: ${MAX_PDF_UPLOAD_BYTES:-20971520}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-15}
      MAX_URL_CONTENT_BYTES: ${MAX_URL_CONTENT_BYTES:-5242880}
      MAX_URL_REDIRECTS: ${MAX_URL_REDIRECTS:-5}
    depends_on:
      wikontic:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  extraction-worker:
    build:
      context: ./Backend/gateway
    restart: unless-stopped
    command:
      - celery
      - -A
      - worker.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_BASE_ADDRESS: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      WIKONTIC_URL: http://wikontic:8001
      WIKONTIC_TIMEOUT_SECONDS: ${WIKONTIC_TIMEOUT_SECONDS:-170}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kg}:${POSTGRES_PASSWORD:-kg}@postgres:5432/${POSTGRES_DB:-knowledge_graph}
      REDIS_URL: redis://redis:6379/0
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-300}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-270}
      EXTRACTION_JOB_MAX_RETRIES: ${EXTRACTION_JOB_MAX_RETRIES:-3}
      EXTRACTION_JOB_RETRY_BACKOFF_SECONDS: ${EXTRACTION_JOB_RETRY_BACKOFF_SECONDS:-30}
      QUEUED_JOB_STALE_SECONDS: ${QUEUED_JOB_STALE_SECONDS:-120}
      RUNNING_JOB_STALE_SECONDS: ${RUNNING_JOB_STALE_SECONDS:-600}
      JOB_RECOVERY_MAX_ATTEMPTS: ${JOB_RECOVERY_MAX_ATTEMPTS:-3}
      JOB_RECOVERY_BATCH_SIZE: ${JOB_RECOVERY_BATCH_SIZE:-100}
      # Maintenance sweeps (worker/maintenance.py) run on this same
      # extraction-worker process, dispatched by celery-beat below.
      AUTH_VISITOR_TTL_SECONDS: ${AUTH_VISITOR_TTL_SECONDS:-7776000}
      VISITOR_CLEANUP_BATCH_SIZE: ${VISITOR_CLEANUP_BATCH_SIZE:-500}
      ORPHAN_UPLOAD_GRACE_SECONDS: ${ORPHAN_UPLOAD_GRACE_SECONDS:-86400}
      MAINTENANCE_HEALTH_CHECK_TIMEOUT_SECONDS: ${MAINTENANCE_HEALTH_CHECK_TIMEOUT_SECONDS:-10}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-kg-documents}
    depends_on:
      wikontic:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # This runs `celery worker`, not the backend's uvicorn server, so the
    # image's inherited HTTP healthcheck (backend/Dockerfile, port 8000)
    # always fails here even when the worker is healthy -- disable it so
    # `docker compose ps` reflects reality instead of a false "unhealthy".
    healthcheck:
      disable: true

  ingestion-worker:
    build:
      context: ./Backend/gateway
    restart: unless-stopped
    command:
      - celery
      - -A
      - worker.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=${INGESTION_WORKER_CONCURRENCY:-2}
      - -Q
      - ingestion
      - -n
      - ingestion-worker@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kg}:${POSTGRES_PASSWORD:-kg}@postgres:5432/${POSTGRES_DB:-knowledge_graph}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-kg-documents}
      MAX_PDF_UPLOAD_BYTES: ${MAX_PDF_UPLOAD_BYTES:-20971520}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-15}
      MAX_URL_CONTENT_BYTES: ${MAX_URL_CONTENT_BYTES:-5242880}
      MAX_URL_REDIRECTS: ${MAX_URL_REDIRECTS:-5}
      INGESTION_MAX_RETRIES: ${INGESTION_MAX_RETRIES:-2}
      INGESTION_RETRY_BACKOFF_SECONDS: ${INGESTION_RETRY_BACKOFF_SECONDS:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # See extraction-worker above: no HTTP server on this command, so the
    # inherited image healthcheck would always report "unhealthy".
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: ./Backend/gateway
    restart: unless-stopped
    command:
      - celery
      - -A
      - worker.celery_app
      - beat
      - --loglevel=INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      JOB_RECOVERY_SWEEP_SECONDS: ${JOB_RECOVERY_SWEEP_SECONDS:-60}
      VISITOR_CLEANUP_SWEEP_SECONDS: ${VISITOR_CLEANUP_SWEEP_SECONDS:-86400}
      ORPHAN_STORAGE_SWEEP_SECONDS: ${ORPHAN_STORAGE_SWEEP_SECONDS:-21600}
      WIKONTIC_HEALTH_CHECK_SWEEP_SECONDS: ${WIKONTIC_HEALTH_CHECK_SWEEP_SECONDS:-300}
    depends_on:
      redis:
        condition: service_healthy
    # See extraction-worker above: no HTTP server on this command, so the
    # inherited image healthcheck would always report "unhealthy".
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_graph}
      POSTGRES_USER: ${POSTGRES_USER:-kg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kg} -d ${POSTGRES_DB:-knowledge_graph}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      # PDF uploads use presigned PUT URLs the browser calls directly, so the
      # S3 API port must be reachable from outside the docker network too.
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  wikontic:
    build:
      context: ./Backend/wikontic
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://wikontic-mongo:27017/?directConnection=true
      KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      PROXY_URL: ${PROXY_URL:-}
      HF_HOME: /models/huggingface
      LLM_LOG_LEVEL: ${LLM_LOG_LEVEL:-preview}
      LLM_LOG_PATH: /app/logs/llm_requests.jsonl
      # Read by GET /health/profiles to know which profiles to check --
      # must match whatever wikontic-init actually initialized.
      WIKONTIC_PROFILES: ${WIKONTIC_PROFILES:-en__contriever}
    volumes:
      - wikontic_models:/models
      - wikontic_logs:/app/logs
    depends_on:
      wikontic-mongo:
        condition: service_healthy

  wikontic-init:
    profiles: ["setup"]
    build:
      context: ./Backend/wikontic
      dockerfile: Dockerfile.api
    environment:
      MONGO_URI: mongodb://wikontic-mongo:27017/?directConnection=true
      WIKONTIC_PROFILES: ${WIKONTIC_PROFILES:-en__contriever}
      HF_HOME: /models/huggingface
    volumes:
      - wikontic_models:/models
    depends_on:
      wikontic-mongo:
        condition: service_healthy
    command: ["python", "scripts/init_profiles.py"]
    restart: "no"

  wikontic-mongo:
    image: mongodb/mongodb-atlas-local:8.0
    restart: unless-stopped
    ports:
      - "${WIKONTIC_MONGO_PORT:-27018}:27017"
    volumes:
      - wikontic_mongo_data:/data/db
      - wikontic_mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)' mongodb://127.0.0.1:27017/admin"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  minio_data:
  wikontic_mongo_data:
  wikontic_mongo_config:
  wikontic_models:
  wikontic_logs:
